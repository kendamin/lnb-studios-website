<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Aperture Drift Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Host+Grotesk:wght@400..700&display=swap" rel="stylesheet">
<style>
:root{--sand:#EEE7DC;--ink:#15120F;--ink-2:#5A5149;--line:#D4C8B7;--red:#D2321F}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font:400 15px/1.5 "Host Grotesk",system-ui,sans-serif;display:grid;grid-template-columns:300px 1fr;min-height:100vh}
@media (max-width:760px){body{grid-template-columns:1fr;grid-template-rows:auto 70vh}}
aside{padding:24px;border-right:1px solid var(--line);display:grid;gap:18px;align-content:start}
@media (max-width:760px){aside{border-right:0;border-bottom:1px solid var(--line)}}
h1{margin:0;font-size:22px;letter-spacing:-.02em}
p{margin:0;color:var(--ink-2)}
label{display:grid;gap:6px;font-weight:600}
label span{display:flex;justify-content:space-between;font-weight:500;color:var(--ink-2)}
input[type=range]{width:100%;accent-color:var(--red)}
input[type=number]{font:inherit;padding:10px 12px;border:1.5px solid var(--line);border-radius:10px;background:#fff;width:100%}
.row{display:flex;gap:8px}
button{font:600 14px/1 inherit;font-family:inherit;min-height:44px;padding:0 16px;border-radius:999px;border:1.5px solid var(--ink);background:var(--ink);color:var(--sand);cursor:pointer}
button.line{background:transparent;color:var(--ink)}
main{position:relative}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
a{color:inherit}
</style>
</head>
<body>
<aside>
  <h1>Aperture Drift</h1>
  <p>The generative ground behind the Option B hero. Same seed, same artwork. The live site uses seed 82 (Davao's area code, 082).</p>
  <label>Seed <input type="number" id="seed" value="82" min="1" max="99999"></label>
  <div class="row"><button type="button" id="prev" class="line" aria-label="Previous seed">←</button><button type="button" id="next" class="line" aria-label="Next seed">→</button><button type="button" id="rand">Random</button></div>
  <label>Speed <span><output id="speedO">1.0</output></span><input type="range" id="speed" min="0.2" max="3" step="0.1" value="1"></label>
  <label>Line count <span><output id="countO">2200</output></span><input type="range" id="count" min="300" max="5000" step="100" value="2200"></label>
  <label>Red strands <span><output id="redO">7%</output></span><input type="range" id="red" min="0" max="0.4" step="0.01" value="0.07"></label>
  <label>Ink strength <span><output id="inkO">0.44</output></span><input type="range" id="ink" min="0.1" max="0.9" step="0.02" value="0.44"></label>
  <p>Move the pointer over the artwork: the current parts around it.</p>
  <p><a href="./">Back to Option B</a></p>
</aside>
<main><canvas id="c" aria-label="Generative flow field artwork"></canvas></main>
<script src="flow.js"></script>
<script>
  const $ = id => document.getElementById(id);
  const f = LNBFlow.create($("c"), { lensX: 0.5, lensY: 0.5, lensR: 0.24 });
  f.pointer($("c").parentElement); f.start();
  const seed = v => { $("seed").value = v; f.set({ seed: v }); };
  $("seed").addEventListener("change", e => seed(+e.target.value || 1));
  $("prev").onclick = () => seed(Math.max(1, +$("seed").value - 1));
  $("next").onclick = () => seed(+$("seed").value + 1);
  $("rand").onclick = () => seed(1 + Math.floor(Math.random() * 99999));
  $("speed").oninput = e => { f.set({ speed: +e.target.value }); $("speedO").value = (+e.target.value).toFixed(1); };
  $("count").onchange = e => { f.set({ count: +e.target.value }); };
  $("count").oninput = e => { $("countO").value = e.target.value; };
  $("red").oninput = e => { f.set({ redShare: +e.target.value }); $("redO").value = Math.round(e.target.value * 100) + "%"; };
  $("ink").oninput = e => { f.set({ inkAlpha: +e.target.value }); $("inkO").value = e.target.value; };
  addEventListener("resize", () => f.set({ seed: +$("seed").value }));
</script>
</body>
</html>
